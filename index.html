/* ================= Helpers ================= */
const $ = (s) => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function load() { try { chats = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { chats = []; } }
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(chats, (k, v) => (k === '_mer') ? undefined : v)); } catch (e) {} }
function cur() { return chats.find(c => c.id === currentId); }
function errMsg(e) { return e?.error?.message || e?.message || (typeof e === 'string' ? e : JSON.stringify(e)); }

function diag(msg) {
  const d = document.getElementById('diag');
  d.classList.remove('hidden');
  d.innerHTML += '<div>' + esc(msg) + '</div>';
}
window.addEventListener('error', (e) => diag('JS error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => diag('Error: ' + errMsg(e.reason)));

try { if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch {}
try { if (window.marked) marked.setOptions({ breaks: true, gfm: true }); } catch {}

function renderMd(text) {

  return '<div style="white-space:pre-wrap">' + esc(text || '') + '</div>';
}
function enhance(el) {
  el.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy-btn')) return;
    const code = pre.querySelector('code');
    if (code) { try { hljs.highlightElement(code); } catch {} }

    btn.className = 'copy-btn'; btn.textContent = 'Copy';
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(code ? code.innerText : pre.innerText); btn.textContent = 'Copied ✓'; }
      catch { btn.textContent = 'Error'; }
      setTimeout(() => btn.textContent = 'Copy', 1500);
    };
    pre.appendChild(btn);
  });
}

/* ================= Sidebar / chats ================= */
function toggleSidebar(open) {
  const sb = $('#sidebar'), bd = $('#backdrop');
  sb.classList.toggle('-translate-x-full', !open);
  bd.classList.toggle('hidden', !open);

    box.appendChild(row);
  });
}

  chats = chats.filter(c => c.id !== id);
  if (currentId === id) currentId = chats.length ? chats[chats.length - 1].id : null;
  save(); renderAll();
}

/* ================= Rendering messages ================= */
const SUGGESTIONS = [
  ['fa-diagram-project', 'Rsem liya diagramme use case l systeme dyal bibliothèque'],

];
function welcomeHTML() {
  return `<div class="text-center pt-10 pb-4">

}

function userBubble(m) {

function renderMessages() {
  const box = $('#messages');
  box.innerHTML = '';
  const c = cur();
  if (!c || c.messages.length === 0) { box.innerHTML = welcomeHTML(); return; }
  c.messages.forEach(m => box.appendChild(m.role === 'user' ? userBubble(m) : aiBubble(m)));

function renderAll() { renderList(); renderMessages(); }
function scrollDown(force) {

/* ================= Attachments ================= */
async function readAttachment(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith('.pdf')) {
    if (!window.pdfjsLib) throw new Error('PDF reader failed to load.');
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let t = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      t += `\n--- Page ${i} ---\n` + tc.items.map(x => x.str).join(' ');
      if (t.length > MAX_FILE_CHARS) break;
    }
    return { name: file.name, type: 'text', text: t.slice(0, MAX_FILE_CHARS) };
  }
  if (n.endsWith('.docx')) {
    if (!window.mammoth) throw new Error('DOCX reader failed to load.');
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { name: file.name, type: 'text', text: r.value.slice(0, MAX_FILE_CHARS) };
  }
  if (/\.(png|jpe?g|webp)$/.test(n)) {
    const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
    return { name: file.name, type: 'image', dataUrl };
  }
  return { name: file.name, type: 'text', text: (await file.text()).slice(0, MAX_FILE_CHARS) };
}
$('#fileInput').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    $('#fileName').textContent = 'Reading ' + f.name + '…';
    $('#fileChip').classList.remove('hidden');
    attached = await readAttachment(f);
    $('#fileName').textContent = f.name;
  } catch (err) {
    attached = null; $('#fileChip').classList.add('hidden');
    alert(errMsg(err));
  }
  e.target.value = '';
});
function removeFile() { attached = null; $('#fileChip').classList.add('hidden'); }

/* ================= Providers (FREE API) ================= */
async function apiError(r, name) {
  let t = '';
  try { t = await r.text(); } catch {}
  let msg = t;
  try { const j = JSON.parse(t); msg = j.error?.message || j.message || t; } catch {}
  return new Error(name + ' error ' + r.status + ': ' + String(msg).slice(0, 300));
}
async function* sseData(r) {
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data:')) continue;
        const d = ln.slice(5).trim();
        if (d && d !== '[DONE]') yield d;
      }
    }
  } finally { try { reader.cancel(); } catch {} }
}
function cleanHistory(history) {
  const h = history.filter(m => m.content && !m.err);
  while (h.length && h[0].role !== 'user') h.shift();
  return h;
}

// FREE API (Pollinations.ai)
async function* getStream(sel, history, image, content) {
  const i = sel.indexOf(':');
  const model = sel.slice(i + 1);
  
  const msgs = [{ role: 'system', content: SYSTEM }, ...cleanHistory(history).map(m => ({ role: m.role, content: m.content }))];
  if (image && msgs.length > 1) {
    const last = msgs[msgs.length - 1];
    last.content = [{ type: 'text', text: last.content }, { type: 'image_url', image_url: { url: image } }];
  }
  
  const r = await fetch('https://text.pollinations.ai/openai', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ model: model, messages: msgs, stream: true })
  });
  
  if (!r.ok) throw await apiError(r, 'Free AI Server');
  for await (const d of sseData(r)) {
    let j; try { j = JSON.parse(d); } catch { continue; }
    const t = j.choices?.[0]?.delta?.content;
    if (t) yield { text: t };
  }
}

/* ================= Diagrams & Canvas Export ================= */
const SVG_OPTS = { USE_PROFILES: { svg: true, svgFilters: true } };

function serializeSvg(svgEl, w, h) {
  const clone = svgEl.cloneNode(true);
  if (w && h) { clone.setAttribute('width', w); clone.setAttribute('height', h); }
  if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  return new XMLSerializer().serializeToString(clone);
}
function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function downloadSvg(svgEl, filename) { saveBlob(new Blob([serializeSvg(svgEl)], { type: 'image/svg+xml;charset=utf-8' }), filename); }
function svgToPng(svgEl, filename) {
  const vb = (svgEl.getAttribute('viewBox') || '').split(' ');
  const w = parseInt(svgEl.getAttribute('width') || vb[2] || '800', 10);
  const h = parseInt(svgEl.getAttribute('height') || vb[3] || '600', 10);
  const svgStr = serializeSvg(svgEl, w, h);
  const img = new Image();
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const cvs = document.createElement('canvas');
    cvs.width = w; cvs.height = h;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#ffffff'; 
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    cvs.toBlob(b => { 
      saveBlob(b, filename); 
      URL.revokeObjectURL(url); 
    }, 'image/png');
  };
  img.src = url;
}

/* ================= Final Rendering ================= */
async function paintFinal(container, m) {
  if (m.err) { 
    container.innerHTML = '<span class="text-rose-400"><i class="fas fa-exclamation-triangle me-2"></i>' + esc(m.content) + '</span>'; 
    return; 
  }
  if (!m.content) { 
    container.innerHTML = '<span class="typing"></span>'; 
    return; 
  }
  
  container.innerHTML = renderMd(m.content);
  enhance(container);

  container.querySelectorAll('pre code.language-svg').forEach(el => {
    const pre = el.parentElement;
    const wrap = document.createElement('div');
    wrap.className = 'my-4 bg-white rounded-xl overflow-hidden border border-slate-700 p-4 relative flex flex-col items-center';
    
    try {
      const cleanSvg = DOMPurify.sanitize(el.innerText, SVG_OPTS);
      const div = document.createElement('div');
      div.innerHTML = cleanSvg;
      const svg = div.querySelector('svg');
      
      if (svg) {
        svg.style.maxWidth = '100%'; 
        svg.style.height = 'auto';
        wrap.appendChild(svg);
        
        const btnWrap = document.createElement('div');
        btnWrap.className = 'flex gap-2 mt-4 w-full justify-center border-t border-slate-200 pt-3';
        
        const dlSvg = document.createElement('button');
        dlSvg.className = 'text-xs font-bold bg-slate-800 text-white px-4 py-1.5 rounded-lg hover:bg-slate-700 transition';
        dlSvg.innerHTML = '<i class="fas fa-download me-1"></i> SVG';
        dlSvg.onclick = () => downloadSvg(svg, 'illustration.svg');
        
        const dlPng = document.createElement('button');
        dlPng.className = 'text-xs font-bold bg-sky-600 text-white px-4 py-1.5 rounded-lg hover:bg-sky-500 transition';
        dlPng.innerHTML = '<i class="fas fa-image me-1"></i> PNG';
        dlPng.onclick = () => svgToPng(svg, 'illustration.png');
        
        btnWrap.append(dlSvg, dlPng);
        wrap.appendChild(btnWrap);
        pre.replaceWith(wrap);
      }
    } catch(e) {}
  });

  if (window.mermaid) {
    container.querySelectorAll('pre code.language-mermaid').forEach(async el => {
      const pre = el.parentElement;
      const src = el.innerText;
      const id = 'mer-' + uid();
      
      const wrap = document.createElement('div');
      wrap.className = 'my-4 bg-slate-900 rounded-xl overflow-hidden border border-slate-700 p-4 flex flex-col items-center';
      
      const target = document.createElement('div');
      target.id = id;
      wrap.appendChild(target);
      pre.replaceWith(wrap);
      
      try {
        const { svg } = await mermaid.render(id, src);
        target.innerHTML = DOMPurify.sanitize(svg, SVG_OPTS);
        const svgEl = target.querySelector('svg');
        
        if (svgEl) {
          svgEl.style.maxWidth = '100%'; 
          svgEl.style.height = 'auto';
          
          const btnWrap = document.createElement('div');
          btnWrap.className = 'flex gap-2 mt-4 justify-center w-full border-t border-slate-800 pt-3';
          
          const dlPng = document.createElement('button');
          dlPng.className = 'text-xs font-bold bg-sky-600 text-white px-4 py-1.5 rounded-lg hover:bg-sky-500 transition';
          dlPng.innerHTML = '<i class="fas fa-image me-1"></i> PNG';
          dlPng.onclick = () => svgToPng(svgEl, 'diagram.png');
          
          btnWrap.appendChild(dlPng);
          wrap.appendChild(btnWrap);
        }
      } catch(e) { 
        wrap.innerHTML = '<div class="text-rose-400 text-xs p-2 font-mono"><i class="fas fa-times-circle me-1"></i> Mermaid Syntax Error</div>'; 
      }
    });
  }
}

function actionsBar(m) {
  const bar = document.createElement('div');
  bar.className = 'flex gap-3 mt-2 pt-2 border-t border-slate-800/70';
  
  const mkBtn = (icon, text, fn) => {
    const b = document.createElement('button');
    b.className = 'text-[11px] font-medium flex items-center gap-1.5 text-slate-400 hover:text-sky-400 transition';
    b.innerHTML = `<i class="fas ${icon}"></i> ${text}`;
    b.onclick = fn;
    return b;
  };
  
  bar.appendChild(mkBtn('fa-file-pdf', 'Export PDF', () => {
     const w = window.open('', '_blank');
     w.document.write(`<html><head><title>Export</title><style>body{font-family:sans-serif;padding:40px;line-height:1.6;color:#111;} pre{background:#f4f4f4;padding:15px;border-radius:8px;} table{border-collapse:collapse;width:100%} th,td{border:1px solid #ddd;padding:8px}</style></head><body>${renderMd(m.content)}</body></html>`);
     w.document.close();
     setTimeout(() => w.print(), 500);
  }));
  
  bar.appendChild(mkBtn('fa-file-word', 'Export Word', () => {
     const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export</title></head><body style="font-family:sans-serif">${renderMd(m.content)}</body></html>`;
     const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
     saveBlob(blob, 'OUARRACH_AI_Export.doc');
  }));
  
  return bar;
}

function toggleImgMode() {
  imgMode = !imgMode;
  const b = $('#imgBtn');
  if (imgMode) b.classList.replace('text-slate-400', 'text-purple-400');
  else b.classList.replace('text-purple-400', 'text-slate-400');
}

/* ================= Chat Engine ================= */
async function send() {
  if (busy) { stopFlag = true; return; }
  
  const inp = $('#input');
  let text = inp.value.trim();
  if (!text && !attached) return;

  const sel = $('#modelSelect').value;
  if (imgMode) text += ' (Please generate a highly detailed, colored SVG illustration block for this request).';

  if (!chats.length || !currentId) newChat();
  const c = cur();
  
  if (!c.title) c.title = text.slice(0, 35) + (text.length > 35 ? '...' : '') || (attached ? attached.name : 'New Chat');

  const uMsg = { role: 'user', content: text, shown: text };
  if (attached) {
    if (attached.type === 'text') uMsg.content = `[Attached File: ${attached.name}]\n\n${attached.text}\n\nUser Question:\n${text}`;
    if (attached.type === 'image') uMsg.image = attached.dataUrl;
    uMsg.file = attached.name;
    removeFile();
  }
  c.messages.push(uMsg);

  const aiMsg = { role: 'assistant', content: '' };
  c.messages.push(aiMsg);
  save(); 
  renderAll();

  inp.value = ''; 
  inp.style.height = 'auto';
  busy = true; 
  stopFlag = false;
  
  const icon = $('#sendIcon'); 
  icon.className = 'fas fa-square text-xs'; 

  try {
    const stream = await getStream(sel, c.messages.slice(0, -1), uMsg.image, uMsg.content);
    for await (const chunk of stream) {
      if (stopFlag) break;
      aiMsg.content += chunk.text || '';
      renderMessages();
    }
  } catch (e) {
    aiMsg.err = true;
    aiMsg.content = errMsg(e);
  }

  busy = false; 
  stopFlag = false;
  icon.className = 'fas fa-arrow-up';
  save(); 
  renderAll();
}

function onSendClick() { send(); }

/* ================= Event Listeners & Init ================= */
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('#input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});

load();
if (chats.length) currentId = chats[chats.length - 1].id;
renderAll();
</script>
