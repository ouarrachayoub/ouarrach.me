<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Navix Media | تنمية حسابات السوشيال ميديا بأسعار مغربية</title>
  <meta name="description"
    content="Navix Media: متابعون، إعجابات ومشاهدات لتيك توك وإنستغرام وفيسبوك ويوتيوب، مع مواقع وتصميم وإعلانات. اطلب بدون حساب وادفع عبر CIH أو CashPlus أو Wafacash.">
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <meta name="theme-color" content="#060508">
  <style>
    :root {
      --bg: #060508;
      --ink: #f3f2ee;
      --mu: #8d8c87;
      --ln: rgba(255, 255, 255, .09);
      --lime: #c6f23d;
      --lime2: #a8d82a;
      --glass: rgba(255, 255, 255, .035);
      --navy: #c6f23d;
      --gold: #c6f23d
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Inter', 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    html[lang=ar] body,
    html[lang=ar] input,
    html[lang=ar] select,
    html[lang=ar] textarea,
    html[lang=ar] .btn {
      font-family: 'Cairo', sans-serif
    }

    a {
      text-decoration: none;
      color: inherit
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, .06) 1px, transparent 0) 0 0/28px 28px, radial-gradient(60% 40% at 50% 100%, rgba(120, 160, 20, .16), transparent 70%)
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 5%;
      background: rgba(6, 5, 8, .72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--ln)
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      direction: ltr;
      letter-spacing: .5px
    }

    .logo svg {
      width: 30px
    }

    .logo b {
      color: #fff
    }

    .logo span {
      color: var(--lime)
    }

    .links {
      display: flex;
      gap: 26px;
      font-weight: 600;
      font-size: 14px;
      color: var(--mu)
    }

    .links a:hover {
      color: #fff
    }

    .rt {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .ic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      border: 1px solid var(--ln);
      background: var(--glass)
    }

    .ic.w {
      color: #25D366
    }

    .ic.w svg {
      width: 21px
    }

    .ic.m {
      color: var(--lime)
    }

    .ic:hover {
      border-color: var(--lime)
    }

    .lang {
      display: flex;
      background: var(--glass);
      border: 1px solid var(--ln);
      border-radius: 30px;
      padding: 3px
    }

    .lang button {
      border: 0;
      background: none;
      font: 700 12px 'JetBrains Mono', monospace;
      padding: 6px 10px;
      border-radius: 30px;
      cursor: pointer;
      color: var(--mu)
    }

    .lang button.on {
      background: var(--lime);
      color: #0a0a0a
    }

    .btn {
      background: var(--lime);
      color: #0a0a0a;
      border: 0;
      border-radius: 40px;
      padding: 13px 26px;
      font: 700 15px 'Inter', 'Cairo';
      cursor: pointer;
      display: inline-block;
      transition: .2s;
      box-shadow: 0 0 0 0 rgba(198, 242, 61, .4)
    }

    .btn.o {
      background: var(--glass);
      border: 1px solid var(--ln);
      color: #fff
    }

    .btn.d {
      background: var(--glass);
      border: 1px solid var(--ln);
      color: #fff
    }

    .btn.sm {
      background: var(--lime);
      color: #0a0a0a;
      border: 0;
      padding: 10px 22px
    }

    .btn:hover {
      box-shadow: 0 0 24px rgba(198, 242, 61, .35);
      transform: translateY(-1px)
    }

    .btn.d:hover,
    .btn.o:hover {
      border-color: var(--lime);
      color: var(--lime)
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 110px 5% 100px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 40px;
      align-items: center;
      background: radial-gradient(50% 60% at 78% 45%, rgba(160, 210, 30, .18), transparent 70%)
    }

    .hero>* {
      position: relative;
      z-index: 1
    }

    .streaks {
      position: absolute !important;
      z-index: 0 !important;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: .9
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      color: #cfd0c8;
      border: 1px solid var(--ln);
      border-radius: 10px;
      padding: 7px 14px;
      font: 500 12.5px 'JetBrains Mono', monospace;
      margin-bottom: 22px
    }

    .pill:before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 8px var(--lime)
    }

    h1 {
      font-size: clamp(36px, 5.6vw, 68px);
      line-height: 1.12;
      font-weight: 600;
      letter-spacing: -1.5px;
      margin-bottom: 22px
    }

    h1 b {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      color: #fff;
      letter-spacing: -.5px
    }

    html[lang=ar] h1 {
      letter-spacing: 0;
      line-height: 1.4;
      font-weight: 800
    }

    html[lang=ar] h1 b {
      font-family: 'Cairo';
      font-style: normal;
      font-weight: 900;
      color: var(--lime)
    }

    .sub {
      font-size: 17px;
      line-height: 1.8;
      color: var(--mu);
      max-width: 520px;
      margin-bottom: 30px
    }

    .cta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap
    }

    .tr {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 28px
    }

    .tr span {
      font: 500 12px 'JetBrains Mono', monospace;
      color: var(--mu);
      border: 1px solid var(--ln);
      background: var(--glass);
      border-radius: 8px;
      padding: 7px 12px
    }

    .vis {
      background: linear-gradient(160deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
      border: 1px solid var(--ln);
      border-radius: 22px;
      padding: 22px;
      backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .5)
    }

    .vh {
      display: flex;
      justify-content: space-between;
      direction: ltr;
      font: 500 12px 'JetBrains Mono', monospace;
      color: var(--mu);
      margin-bottom: 22px
    }

    .vh em {
      font-style: normal;
      color: var(--lime)
    }

    .vis .bars {
      direction: ltr;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      height: 190px
    }

    .vis .bars i {
      flex: 1;
      background: linear-gradient(180deg, var(--lime), rgba(198, 242, 61, .12));
      border-radius: 8px 8px 3px 3px;
      animation: gr 1.6s cubic-bezier(.2, .7, .2, 1) both
    }

    @keyframes gr {
      from {
        height: 0 !important
      }
    }

    .vis .row {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      font: 500 13px 'JetBrains Mono', monospace;
      color: var(--mu);
      direction: ltr
    }

    .vis .row b {
      color: var(--lime)
    }

    section {
      padding: 90px 5%
    }

    .alt {
      background: rgba(255, 255, 255, .02);
      border-block: 1px solid var(--ln)
    }

    .hd {
      text-align: center;
      max-width: 680px;
      margin: 0 auto 46px
    }

    .hd h2 {
      font-size: clamp(28px, 4.2vw, 44px);
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 12px
    }

    html[lang=ar] .hd h2 {
      font-weight: 800;
      letter-spacing: 0
    }

    .hd p {
      color: var(--mu);
      line-height: 1.7
    }

    .g {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--ln);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(8px)
    }

    .pc {
      text-align: center;
      transition: transform .2s, border-color .2s, box-shadow .2s
    }

    .pc:hover {
      transform: translateY(-4px);
      border-color: rgba(198, 242, 61, .6);
      box-shadow: 0 10px 40px rgba(198, 242, 61, .08)
    }

    .pc .i {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .15)
    }

    .pc h3 {
      font-size: 19px;
      font-weight: 600
    }

    .pc .p {
      margin: 8px 0 18px;
      color: var(--mu);
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace
    }

    .pc .p b {
      display: block;
      font: 600 24px 'Inter';
      color: var(--lime);
      direction: ltr;
      margin-top: 4px
    }

    .pay {
      background: radial-gradient(60% 80% at 50% 0, rgba(160, 210, 30, .10), transparent 70%)
    }

    .pay .card {
      color: #fff
    }

    .pay h3 {
      margin-bottom: 12px;
      font-size: 21px;
      font-weight: 600
    }

    .pay .f {
      font: 500 11px 'JetBrains Mono', monospace;
      color: var(--mu);
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .pay .v {
      font-weight: 600;
      direction: ltr;
      word-break: break-all;
      margin-top: 3px
    }

    .pay .btn {
      margin-top: 16px;
      padding: 9px 18px;
      font-size: 13px
    }

    .st {
      counter-reset: s
    }

    .st .card {
      position: relative;
      padding-top: 44px
    }

    .st .card:before {
      counter-increment: s;
      content: "0" counter(s);
      position: absolute;
      top: 18px;
      inset-inline-start: 24px;
      font: 500 12px 'JetBrains Mono', monospace;
      color: var(--lime)
    }

    .card h4 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px
    }

    .card p {
      color: var(--mu);
      line-height: 1.7;
      font-size: 14.5px
    }

    .faq {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .faq .card h4 {
      color: #fff
    }

    .band {
      text-align: center;
      background: radial-gradient(50% 90% at 50% 100%, rgba(198, 242, 61, .22), transparent 70%)
    }

    .band p {
      color: var(--mu);
      margin: 10px 0 26px
    }

    footer {
      border-top: 1px solid var(--ln);
      color: var(--mu);
      padding: 30px 5%;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      font: 500 13px 'JetBrains Mono', monospace
    }

    .fw {
      position: fixed;
      bottom: 20px;
      inset-inline-start: 20px;
      z-index: 45;
      width: 58px;
      height: 58px;
      background: #25D366;
      color: #fff !important;
      border: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
      animation: pu 2.4s infinite
    }

    .fw svg {
      width: 30px
    }

    @keyframes pu {
      70% {
        box-shadow: 0 8px 24px rgba(0, 0, 0, .5), 0 0 0 14px rgba(37, 211, 102, 0)
      }
    }

    .md {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, .78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px
    }

    .md.on {
      display: flex
    }

    .box {
      background: #0e0d12;
      border: 1px solid var(--ln);
      border-radius: 22px;
      width: 100%;
      max-width: 520px;
      max-height: 94vh;
      overflow: auto;
      padding: 26px;
      position: relative;
      box-shadow: 0 0 80px rgba(198, 242, 61, .08)
    }

    .box h3 {
      font-size: 22px;
      margin-bottom: 16px
    }

    .x {
      position: absolute;
      top: 14px;
      inset-inline-end: 16px;
      background: none;
      border: 0;
      font-size: 22px;
      cursor: pointer;
      color: var(--mu)
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin: 12px 0 6px;
      color: var(--mu)
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--ln);
      background: rgba(255, 255, 255, .04);
      border-radius: 12px;
      padding: 12px;
      font: 500 15px 'Inter', 'Cairo';
      color: var(--ink)
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 0;
      border-color: var(--lime)
    }

    option {
      background: #111;
      color: #fff
    }

    .tot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(198, 242, 61, .07);
      border: 1px solid rgba(198, 242, 61, .25);
      border-radius: 14px;
      padding: 14px;
      margin: 16px 0;
      font-weight: 700
    }

    .tot b {
      font-size: 24px;
      color: var(--lime);
      direction: ltr
    }

    .er {
      background: rgba(255, 70, 90, .12);
      color: #ff8a98;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      margin-bottom: 10px
    }

    .ok {
      background: rgba(198, 242, 61, .1);
      color: var(--lime);
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.7
    }

    @media(max-width:860px) {
      .links {
        display: none
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 60px 5%;
        text-align: center
      }

      .sub {
        margin-inline: auto
      }

      .cta,
      .tr {
        justify-content: center
      }

      section {
        padding: 60px 5%
      }

      .lang button {
        padding: 5px 7px
      }

      .btn.sm {
        display: none
      }

      nav {
        padding: 10px 4%;
        gap: 6px
      }

      .logo {
        font-size: 15px;
        gap: 6px
      }

      .logo svg {
        width: 22px
      }

      .rt {
        gap: 5px
      }

      .ic.m {
        display: none
      }

      .ic {
        width: 34px;
        height: 34px
      }

      .lang button {
        font-size: 11px;
        padding: 5px 6px
      }

      .hero {
        padding-top: 44px
      }

      .vis {
        padding: 16px
      }
    }

    .hero:after {
      content: "";
      position: absolute;
      inset-inline-end: -8%;
      top: 5%;
      width: 62%;
      height: 90%;
      background: radial-gradient(closest-side, rgba(198, 242, 61, .17), transparent);
      animation: orb 7s ease-in-out infinite alternate;
      pointer-events: none
    }

    @keyframes orb {
      from {
        transform: scale(.9);
        opacity: .6
      }

      to {
        transform: scale(1.12);
        opacity: 1
      }
    }

    .streaks {
      transition: transform .8s cubic-bezier(.2, .7, .2, 1)
    }

    .streaks path.b {
      stroke-opacity: .16
    }

    .streaks path.f {
      stroke-dasharray: 150 750;
      stroke-linecap: round;
      animation: fl 9s linear infinite
    }

    .streaks path.f:nth-of-type(3n) {
      animation-duration: 13s
    }

    .streaks path.f:nth-of-type(3n+1) {
      animation-duration: 7s;
      animation-delay: -3s
    }

    .streaks path.f:nth-of-type(4n) {
      animation-duration: 16s;
      animation-delay: -6s
    }

    @keyframes fl {
      to {
        stroke-dashoffset: -900
      }
    }

    .hero>div:first-child>* {
      animation: up .9s cubic-bezier(.2, .7, .2, 1) both
    }

    .hero>div:first-child>*:nth-child(2) {
      animation-delay: .1s
    }

    .hero>div:first-child>*:nth-child(3) {
      animation-delay: .2s
    }

    .hero>div:first-child>*:nth-child(4) {
      animation-delay: .3s
    }

    .hero>div:first-child>*:nth-child(5) {
      animation-delay: .4s
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(24px)
      }
    }

    .vis {
      animation: up 1s .3s cubic-bezier(.2, .7, .2, 1) both, flt 7s 1.3s ease-in-out infinite alternate
    }

    @keyframes flt {
      to {
        transform: translateY(-10px)
      }
    }

    .flow {
      position: relative;
      direction: ltr;
      aspect-ratio: 400/230;
      width: 100%
    }

    .flow svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .flow path {
      fill: none;
      stroke: rgba(198, 242, 61, .45);
      stroke-width: 1.5
    }

    .nd {
      position: absolute;
      width: 29%;
      min-height: 19%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(14, 13, 18, .85);
      border: 1px solid var(--ln);
      font-weight: 600;
      font-size: 12.5px;
      line-height: 1.25;
      animation: act 3.6s infinite
    }

    .nd small {
      font: 500 10px 'JetBrains Mono', monospace;
      color: var(--mu)
    }

    .n1 {
      left: 0;
      top: 8%
    }

    .n2 {
      left: 35.5%;
      top: 40.5%;
      animation-delay: 1.2s
    }

    .n3 {
      left: 71%;
      top: 72%;
      animation-delay: 2.4s
    }

    @keyframes act {

      0%,
      30% {
        border-color: var(--lime);
        box-shadow: 0 0 22px rgba(198, 242, 61, .3)
      }

      38%,
      100% {
        border-color: rgba(255, 255, 255, .09);
        box-shadow: none
      }
    }

    .vis .bars {
      height: 70px;
      margin-top: 20px
    }

    .vis .bars i {
      animation: gr 1.6s cubic-bezier(.2, .7, .2, 1) both, pl 3s 2s ease-in-out infinite alternate
    }

    @keyframes pl {
      to {
        opacity: .65
      }
    }

    .mq {
      overflow: hidden;
      border-block: 1px solid var(--ln);
      padding: 18px 0;
      direction: ltr;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent)
    }

    .mt {
      display: flex;
      width: max-content;
      animation: mq 34s linear infinite
    }

    .mt span {
      padding-inline-end: 56px;
      font: 500 13px 'JetBrains Mono', monospace;
      color: var(--mu);
      text-transform: uppercase;
      letter-spacing: 1.5px
    }

    .mt span:before {
      content: "◆";
      color: var(--lime);
      margin-inline-end: 56px;
      font-size: 8px;
      vertical-align: middle
    }

    @keyframes mq {
      to {
        transform: translateX(-50%)
      }
    }

    .card {
      background: radial-gradient(240px circle at var(--mx, 50%) var(--my, -80%), rgba(198, 242, 61, .10), transparent 70%), var(--glass)
    }

    .calc {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 28px;
      padding: 30px
    }

    .calc label:first-child {
      margin-top: 0
    }

    .rl {
      display: flex;
      justify-content: space-between;
      direction: ltr;
      font: 500 11px 'JetBrains Mono', monospace;
      color: var(--mu)
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border: 0;
      padding: 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, .12);
      direction: ltr;
      margin: 18px 0 10px
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 0 7px rgba(198, 242, 61, .18);
