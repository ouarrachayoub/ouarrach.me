<script>
/* ================= Config ================= */
const SYSTEM = `You are OUARRACH AI, a smart, friendly and highly capable assistant. You answer ANY question: study, programming, math, science, writing, daily life, business, ideas, translation, and more.
- Reply in the same language the user writes in (Moroccan Darija, Arabic, French, English...). If the user writes Darija in Latin letters, reply in Darija in Latin letters.
- Give complete, well-structured, in-depth answers by default (like a top expert tutor). Do not be brief or cut your answer short unless the user asks for a short one. Use headings, lists, examples and code blocks when they help.
- Be accurate and clear. Explain step by step when it helps. For exercises (TD/exams) give a full worked solution. For code, give correct, runnable code in code blocks and explain briefly.
- If a file is attached, base your answer on its real content. If you are not sure about something, say so instead of inventing.
- Give complete, thorough, high-quality answers like a top-tier assistant: go in depth, use markdown (headings, lists, tables, code blocks), give examples, and do not cut answers short unless the user asks for brevity.
- This app has built-in tools. Under every answer there are buttons to download it as PDF or Word. There is an image button (🖼) in the input bar, and typing "/img <description>" generates an image. If the user asks for a PDF, a Word file or an image, never say you cannot: write the full content of the document right away and tell them to click the PDF/Word button under your answer, or for images and diagrams follow the IMAGE AND DIAGRAM RULES below.
- IMAGE AND DIAGRAM RULES (very important): (1) If the user wants a picture, photo, illustration, logo, poster, wallpaper or any artistic/realistic image, reply with ONE short sentence in the user's language and then, on its own line, exactly: [[IMAGE: <very detailed English description of the image: subject, style, colors, lighting, composition>]]. Never refuse and never say you cannot create images. Never put this tag inside a code block. (2) If the user wants a diagram, schema, UML (use case, class, sequence...), flowchart, mind map, architecture, timeline or chart, DRAW it yourself as code: use a markdown fenced code block whose language is mermaid when Mermaid supports it (flowchart, sequenceDiagram, classDiagram, stateDiagram-v2, erDiagram, gantt, mindmap); otherwise (for example UML use case diagrams or custom schemas) write one complete self-contained fenced code block whose language is svg, with a viewBox, designed for a WHITE background (include a white rect), readable font sizes, clear arrows (marker defs), using presentation attributes (fill, stroke, font-size) and NO style tag, NO script, NO external images. The app renders these blocks as pictures with PNG/SVG download buttons. Do not send the user to external tools like PlantUML; just draw it. Add a short explanation after the diagram.`;

const LS_KEY = 'ouarrach_chats_v2', LS_MODEL = 'ouarrach_model_v3', MAX_FILE_CHARS = 60000;
let chats = [], currentId = null, busy = false, stopFlag = false, attached = null;

/* ================= Helpers ================= */
const $ = (s) => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function load() { try { chats = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { chats = []; } }
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(chats, (k, v) => (k === 'img' || k === '_mer') ? undefined : v)); } catch (e) { /* storage full: ignore */ } }
function cur() { return chats.find(c => c.id === currentId); }
function errMsg(e) { return e?.error?.message || e?.message || (typeof e === 'string' ? e : JSON.stringify(e)); }

function diag(msg) {
  const d = document.getElementById('diag');
  d.classList.remove('hidden');
  d.innerHTML += '<div>' + esc(msg) + '</div>';
}
window.addEventListener('error', (e) => diag('JS error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => diag('Error: ' + errMsg(e.reason)));

try { if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch {}
try { if (window.marked) marked.setOptions({ breaks: true, gfm: true }); } catch {}

function renderMd(text) {
  try {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text || ''));
  } catch {}
  return '<div style="white-space:pre-wrap">' + esc(text || '') + '</div>';
}
function enhance(el) {
  el.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy-btn')) return;
    const code = pre.querySelector('code');
    if (code) { try { hljs.highlightElement(code); } catch {} }
    const btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.textContent = 'Copy';
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(code ? code.innerText : pre.innerText); btn.textContent = 'Copied ✓'; }
      catch { btn.textContent = 'Error'; }
      setTimeout(() => btn.textContent = 'Copy', 1500);
    };
    pre.appendChild(btn);
  });
}

/* ================= Sidebar / chats ================= */

  box.innerHTML = '';
  chats.slice().reverse().forEach(c => {

    row.className = 'group flex items-center gap-2 rounded-xl px-3 py-2 text-sm cursor-pointer transition ' +

    const t = document.createElement('span');
    t.className = 'flex-1 truncate'; t.dir = 'auto'; t.textContent = c.title || 'New chat';
    const d = document.createElement('button');

    row.onclick = () => { if (busy) return; currentId = c.id; renderAll(); toggleSidebar(false); };

    box.appendChild(row);

}
function newChat() {
  if (busy) return;
  const c = { id: uid(), title: '', messages: [] };

}
function deleteChat(id) {
  if (busy) return;
  chats = chats.filter(c => c.id !== id);
  if (currentId === id) currentId = chats.length ? chats[chats.length - 1].id : null;
  save(); renderAll();
}
function clearAll() {
  if (busy) return;
  if (!confirm('Delete all chats?')) return;
  chats = []; currentId = null; save(); renderAll();
}

/* ================= Rendering messages ================= */
const SUGGESTIONS = [
  ['fa-code', 'Chra7 liya récursivité f Python b mital'],
  ['fa-square-root-variable', 'Ch7al hiya intégrale de x·sin(x) ? 7ellha khtwa b khtwa'],
  ['fa-language', 'Traduis had l-jomla l français w l\'anglais: "Kanbghi nt3alem l-programmation"'],
  ['fa-lightbulb', 'A3ṭini 5 afkar dyal projet informatique l fin d\'études'],
];
function welcomeHTML() {
  return `<div class="text-center pt-10 pb-4">
    <div class="w-14 h-14 mx-auto rounded-3xl brand-grad flex items-center justify-center text-white text-xl shadow-xl shadow-sky-500/20 mb-4"><i class="fas fa-brain"></i></div>
    <h2 class="text-2xl font-extrabold text-white mb-1">Salam! Ana OUARRACH AI 👋</h2>
    <p class="text-slate-400 text-sm mb-6" dir="auto">اسأل أي سؤال أو أرفق PDF / Cours / TD / كود وسأجيبك · Ask anything or attach a file</p>
    <div class="grid sm:grid-cols-2 gap-3 text-start">
      ${SUGGESTIONS.map((s, i) => `<button onclick="useSuggestion(${i})" class="p-4 rounded-2xl bg-slate-900/70 border border-slate-800 hover:border-sky-500/50 hover:bg-slate-800/70 transition text-sm text-slate-300 flex gap-3 items-start"><i class="fas ${s[0]} text-sky-400 mt-0.5"></i><span dir="auto">${esc(s[1])}</span></button>`).join('')}
    </div>
  </div>`;
}
function useSuggestion(i) { $('#input').value = SUGGESTIONS[i][1]; send(); }

function userBubble(m) {
  const wrap = document.createElement('div');
  wrap.className = 'flex justify-end';
  const b = document.createElement('div');
  b.className = 'brand-grad text-white rounded-2xl rounded-ee-md px-4 py-3 max-w-[85%] text-sm shadow-lg whitespace-pre-wrap break-words';
  b.dir = 'auto';
  if (m.file) {
    const chip = document.createElement('div');
    chip.className = 'text-xs font-bold mb-1 opacity-90';
    chip.innerHTML = '<i class="fas fa-paperclip me-1"></i>';
    chip.appendChild(document.createTextNode(m.file));
    b.appendChild(chip);
  }
  b.appendChild(document.createTextNode(m.shown || ''));
  wrap.appendChild(b);

}
function aiBubble(m) {
  const wrap = document.createElement('div');
  wrap.className = 'flex gap-3 items-start';
  wrap.innerHTML = '<div class="w-8 h-8 rounded-xl brand-grad flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-md">AI</div>';

  col.className = 'flex-1 min-w-0';

function renderMessages() {
  const box = $('#messages');
  box.innerHTML = '';
  const c = cur();
  if (!c || c.messages.length === 0) { box.innerHTML = welcomeHTML(); return; }
  c.messages.forEach(m => box.appendChild(m.role === 'user' ? userBubble(m) : aiBubble(m)));

function renderAll() { renderList(); renderMessages(); }
function scrollDown(force) {

  const near = s.scrollHeight - s.scrollTop - s.clientHeight < 160;
  if (force || near) s.scrollTop = s.scrollHeight;
}

/* ================= Attachments ================= */
async function readAttachment(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith('.pdf')) {
    if (!window.pdfjsLib) throw new Error('PDF reader failed to load (CDN blocked?). Try another network or paste the text.');
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let t = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      t += `\n--- Page ${i} ---\n` + tc.items.map(x => x.str).join(' ');
      if (t.length > MAX_FILE_CHARS) break;
    }
    if (t.replace(/--- Page \d+ ---/g, '').trim().length < 30) throw new Error('This PDF has no selectable text (scanned?). Try a screenshot as an image instead.');
    return { name: file.name, type: 'text', text: t.slice(0, MAX_FILE_CHARS) };
  }
  if (n.endsWith('.docx')) {
    if (!window.mammoth) throw new Error('DOCX reader failed to load (CDN blocked?).');
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { name: file.name, type: 'text', text: r.value.slice(0, MAX_FILE_CHARS) };
  }
  if (/\.(png|jpe?g|webp)$/.test(n)) {
    const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
    return { name: file.name, type: 'image', dataUrl };
  }
  return { name: file.name, type: 'text', text: (await file.text()).slice(0, MAX_FILE_CHARS) };
}
$('#fileInput').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    $('#fileName').textContent = 'Reading ' + f.name + '…';
    $('#fileChip').classList.remove('hidden');
    attached = await readAttachment(f);
    $('#fileName').textContent = f.name;
  } catch (err) {
    attached = null; $('#fileChip').classList.add('hidden');
    alert(errMsg(err));
  }
  e.target.value = '';
});
function removeFile() { attached = null; $('#fileChip').classList.add('hidden'); }

/* ================= Direct Anthropic API (optional, needs your key) ================= */
const LS_API = 'ouarrach_api_key_v1';
function getApiKey() {
  let k = '';
  try { k = localStorage.getItem(LS_API) || ''; } catch {}
  if (!k) {
    k = (prompt('Paste your Anthropic API key (sk-ant-...). It is stored only in this browser:') || '').trim();
    if (k) { try { localStorage.setItem(LS_API, k); } catch {} }
  }
  return k;
}
async function* anthropicStream(history, image) {
  const key = getApiKey();
  if (!key) throw new Error('No API key provided.');
  const msgs = history.map(m => ({ role: m.role, content: m.content }));
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  if (image && msgs.length) {
    const mm = /^data:(.+?);base64,(.+)$/.exec(image);
    if (mm) {
      const last = msgs[msgs.length - 1];
      last.content = [{ type: 'image', source: { type: 'base64', media_type: mm[1], data: mm[2] } }, { type: 'text', text: last.content }];
    }
  }
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model: 'claude-sonnet-5-5', max_tokens: 8192, system: SYSTEM, messages: msgs, stream: true })
  });
  if (!r.ok) {
    const t = await r.text();
    if (r.status === 401) { try { localStorage.removeItem(LS_API); } catch {} }
    throw new Error('Anthropic API ' + r.status + ': ' + t.slice(0, 300));
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data:')) continue;
        const d = ln.slice(5).trim();
        if (!d || d === '[DONE]') continue;
        try {
          const j = JSON.parse(d);
          if (j.type === 'content_block_delta' && j.delta && j.delta.text) yield { text: j.delta.text };
        } catch {}
      }
    }
  } finally { try { reader.cancel(); } catch {} }
}

/* ================= Image mode, message actions, exports ================= */
let imgMode = false;
function toggleImgMode() {
  imgMode = !imgMode;
  const b = $('#imgBtn');
  b.classList.toggle('text-purple-400', imgMode);
  b.classList.toggle('bg-slate-800', imgMode);
  $('#input').placeholder = imgMode ? 'Describe the image you want… / صف الصورة…' : 'Ask anything… / اسأل أي سؤال… / Pose ta question…';
  $('#input').focus();
}

function paintFinal(el, m) {
  el.innerHTML = renderMd(m.content);
  if (m.img) {
    const box = document.createElement('div');
    box.className = 'my-3';
    const img = document.createElement('img');
    img.src = m.img; img.alt = 'generated image';
    img.className = 'rounded-2xl border border-slate-700 max-w-full sm:max-w-md';
    const a = document.createElement('a');
    a.href = m.img; a.download = 'ouarrach-image.png';
    a.className = 'inline-block mt-2 text-xs text-sky-400 hover:underline';
    a.textContent = '⬇ Download image';
    box.append(img, document.createElement('br'), a);
    el.appendChild(box);
  }
  renderDiagrams(el, m);
  enhance(el);
}

/* ---------- Diagrams (mermaid + svg code blocks rendered as pictures) ---------- */
const SVG_OPTS = { USE_PROFILES: { svg: true, svgFilters: true } };

function serializeSvg(svgEl, w, h) {
  const clone = svgEl.cloneNode(true);
  if (w && h) { clone.setAttribute('width', w); clone.setAttribute('height', h); }
  if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  return new XMLSerializer().serializeToString(clone);
}
function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function downloadSvg(svgEl, filename) {
  saveBlob(new Blob([serializeSvg(svgEl)], { type: 'image/svg+xml;charset=utf-8' }), filename);
}
function svgToPng(svgEl, filename) {
  const vb = (svgEl.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
  const rect = svgEl.getBoundingClientRect();
  const w = (vb.length === 4 && vb[2]) || rect.width || 800;
  const h = (vb.length === 4 && vb[3]) || rect.height || 600;
  const url = URL.createObjectURL(new Blob([serializeSvg(svgEl, w, h)], { type: 'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  img.onload = () => {
    const s = 2, c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    try { c.toBlob(b => b ? saveBlob(b, filename) : alert('PNG export failed. Use SVG.'), 'image/png'); }
    catch { alert('PNG export blocked by the browser. Use the SVG button instead.'); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('Could not export PNG. Use the SVG button instead.'); };
  img.src = url;
}
function diagramBox(svgMarkup, pre) {
  const view = document.createElement('div');
  view.className = 'bg-white rounded-2xl p-3 overflow-auto border border-slate-700';
  view.style.direction = 'ltr';
  view.innerHTML = svgMarkup;
  const svg = view.querySelector('svg');
  if (!svg) return;
  svg.style.maxWidth = '100%'; svg.style.height = 'auto';
  const box = document.createElement('div');
  box.className = 'my-3';
  const bar = document.createElement('div');
  bar.className = 'flex gap-2 mt-2 text-[11px]';
  const mk = (label, fn) => {
    const b = document.createElement('button');
    b.className = 'px-2.5 py-1 rounded-lg border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-800 transition';
    b.textContent = label; b.onclick = fn;
    return b;
  };
  bar.append(
    mk('⬇ PNG', () => svgToPng(svg, 'ouarrach-diagram.png')),
    mk('⬇ SVG', () => downloadSvg(svg, 'ouarrach-diagram.svg')),
    mk('</> Code', () => { pre.style.display = pre.style.display === 'none' ? '' : 'none'; })
  );
  box.append(view, bar);
  pre.style.display = 'none';
  pre.before(box);
}
async function renderDiagrams(el, m) {
  m._mer = m._mer || [];
  let mi = 0;
  for (const code of [...el.querySelectorAll('pre code')]) {
    const cls = code.className || '';
    const pre = code.parentElement;
    try {
      if (/language-svg/.test(cls)) {
        const clean = DOMPurify.sanitize(code.textContent, SVG_OPTS);
        if (clean.includes('<svg')) diagramBox(clean, pre);
      } else if (/language-mermaid/.test(cls) && window.mermaid) {
        const idx = mi++;
        const id = 'mmd' + uid();
        try {
          const { svg } = await mermaid.render(id, code.textContent);
          m._mer[idx] = svg;
          diagramBox(svg, pre);
        } finally { const junk = document.getElementById('d' + id); if (junk) junk.remove(); }
      }
    } catch (e) { /* keep the code visible if it cannot be drawn */ }
  }
}

function actionsBar(m) {
  const bar = document.createElement('div');
  bar.className = 'actions flex gap-2 mt-2 text-[11px]';
  const mk = (icon, label, fn) => {
    const b = document.createElement('button');
    b.className = 'px-2.5 py-1 rounded-lg border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-800 transition';
    b.innerHTML = '<i class="fas ' + icon + ' me-1"></i>' + label;
    b.onclick = () => fn(b);
    return b;
  };
  bar.append(
    mk('fa-copy', 'Copy', async (b) => { try { await navigator.clipboard.writeText(m.content); b.lastChild.textContent = 'Copied ✓'; setTimeout(() => b.lastChild.textContent = 'Copy', 1500); } catch {} }),
    mk('fa-file-pdf', 'PDF', () => exportDoc('pdf', m)),
    mk('fa-file-word', 'Word', () => exportDoc('doc', m))
  );
  return bar;
}

function exportDoc(kind, m) {
  // diagrams (svg / mermaid) are swapped in as placeholders so markdown does not mangle them
  const diagrams = [];
  let mer = 0;
  const md = (m.content || '')
    .replace(/```svg[ \t]*\n([\s\S]*?)```/g, (_, s) => { diagrams.push(DOMPurify.sanitize(s, SVG_OPTS)); return '\n\n@@DIAG' + (diagrams.length - 1) + '@@\n\n'; })
    .replace(/```mermaid[ \t]*\n[\s\S]*?```/g, (blk) => {
      const s = m._mer && m._mer[mer]; mer++;
      if (!s) return blk;
      diagrams.push(s); return '\n\n@@DIAG' + (diagrams.length - 1) + '@@\n\n';
    });
  const body = renderMd(md).replace(/@@DIAG(\d+)@@/g, (_, i) => diagrams[+i]);
  const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>OUARRACH AI</title><style>' +
    'body{font-family:Arial,Tahoma,sans-serif;line-height:1.7;padding:24px;color:#111}h1,h2,h3{color:#0b3d91}' +
    'pre{background:#f3f4f6;padding:10px;border-radius:6px;white-space:pre-wrap;direction:ltr;text-align:left}' +
    'code{background:#f3f4f6;padding:1px 4px}table{border-collapse:collapse}td,th{border:1px solid #999;padding:6px}' +
    '</style></head><body dir="auto">' + body + '</body></html>';
  if (kind === 'doc') {
    const blob = new Blob(['﻿', html], { type: 'application/msword' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'ouarrach-ai.doc';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  } else {
    // "Save as PDF" in the print dialog: works perfectly with Arabic / RTL
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
    setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 3000); }, 400);
  }
}

/* ================= Sending ================= */
function onSendClick() { busy ? (stopFlag = true) : send(); }
function setBusy(v) {
  busy = v;
  $('#sendIcon').className = v ? 'fas fa-stop' : 'fas fa-arrow-up';
}

async function send() {
  if (busy) return;
  const input = $('#input');
  const text = input.value.trim();
  if (!text && !attached) return;
  const useKey = $('#modelSelect').value === '__key__';
  if (!useKey && typeof puter === 'undefined') {
    diag('Puter engine did not load (network/CDN blocked or file:// issue). Choose "My Anthropic API key" in the model list, or host this file online.');
    return;
  }

  if (!cur()) { const c = { id: uid(), title: '', messages: [] }; chats.push(c); currentId = c.id; }
  const chat = cur();

  let content = text || 'Please analyze the attached file.';
  let image = null, fileName = null;
  if (attached) {
    fileName = attached.name;
    if (attached.type === 'text') content += `\n\n[Attached file: ${attached.name}]\n${attached.text}`;
    else image = attached.dataUrl;
  }

  chat.messages.push({ role: 'user', content, shown: text, file: fileName });
  if (!chat.title) chat.title = (text || fileName || 'New chat').slice(0, 40);
  const aiMsg = { role: 'assistant', content: '' };
  chat.messages.push(aiMsg);

  input.value = ''; input.style.height = 'auto'; removeFile();
  renderAll();

  // streaming bubble = last bubble
  const bubble = $('#messages').lastElementChild.querySelector('.md');
  bubble.classList.add('typing');
  setBusy(true); stopFlag = false;

  const model = $('#modelSelect').value;
  const opts = { stream: true, max_tokens: 8000 }; if (model && model !== '__key__') opts.model = model;
  const history = chat.messages.slice(0, -1).slice(-14).map(m => ({ role: m.role, content: m.content }));

  try {
    let resp;
    if (imgMode || /^\/img\s+/i.test(text)) {
      if (typeof puter === 'undefined') throw new Error('Image engine (Puter) did not load. Check internet and reload.');
      const p = text.replace(/^\/img\s+/i, '').trim() || 'a beautiful landscape';
      const el = await puter.ai.txt2img(p);
      aiMsg.img = el.src;
      aiMsg.content = '🖼️ ' + p;
      return;
    }
    if (useKey) {
      resp = anthropicStream(history, image);
    } else if (image) {
      const transcript = history.slice(0, -1).map(m => (m.role === 'user' ? 'User: ' : 'Assistant: ') + m.content).join('\n\n');
      const prompt = SYSTEM + (transcript ? '\n\nConversation so far:\n' + transcript : '') + '\n\nUser: ' + content;
      resp = await puter.ai.chat(prompt, image, opts);
    } else {
      resp = await puter.ai.chat([{ role: 'system', content: SYSTEM }, ...history], opts);
    }

    let pending = false;
    const shown = (t) => t.replace(/\[\[IMAGE:[\s\S]*$/i, '\n\n_🖼️ Generating image…_');
    const paint = () => { pending = false; bubble.innerHTML = renderMd(shown(aiMsg.content)); scrollDown(false); };
    if (resp && typeof resp[Symbol.asyncIterator] === 'function') {
      for await (const part of resp) {
        if (stopFlag) break;
        if (part?.text) {
          aiMsg.content += part.text;
          if (!pending) { pending = true; requestAnimationFrame(paint); }
        }
      }
    } else {
      const c = resp?.message?.content;
      aiMsg.content = typeof c === 'string' ? c : Array.isArray(c) ? c.map(x => x.text || '').join('') : String(resp?.text ?? resp ?? '');
    }
    // the model asked for an image: [[IMAGE: english prompt]] -> generate it
    const tag = aiMsg.content.match(/\[\[IMAGE:\s*([\s\S]+?)\]\]/i);
    if (tag && typeof puter !== 'undefined' && !stopFlag) {
      const p = tag[1].trim();
      aiMsg.content = aiMsg.content.replace(tag[0], '').trim();
      bubble.innerHTML = renderMd((aiMsg.content ? aiMsg.content + '\n\n' : '') + '_🖼️ Generating image…_');
      try {
        const el = await puter.ai.txt2img(p);
        aiMsg.img = el.src;
        if (!aiMsg.content) aiMsg.content = '🖼️ ' + p;
      } catch (e) {
        aiMsg.content += '\n\n⚠️ Image generation failed: ' + errMsg(e);
      }
    }
    if (!aiMsg.content.trim()) aiMsg.content = stopFlag ? '_(stopped)_' : '_(empty response — try another model from the list above)_';
  } catch (err) {
    aiMsg.content = (aiMsg.content ? aiMsg.content + '\n\n' : '') + '⚠️ **Error:** ' + errMsg(err) +
      '\n\nTry: reload the page, pick another model, or sign in to Puter if a popup appeared (allow popups).';
  } finally {
    bubble.classList.remove('typing');
    paintFinal(bubble, aiMsg);
    if (aiMsg.content && !bubble.parentElement.querySelector('.actions')) bubble.parentElement.appendChild(actionsBar(aiMsg));
    setBusy(false); stopFlag = false;
    save(); renderList(); scrollDown(false);
  }
}

/* ================= Init ================= */
const ta = $('#input');
ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 192) + 'px'; });
ta.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
try { const m = localStorage.getItem(LS_MODEL); if (m !== null) $('#modelSelect').value = m; } catch {}
$('#modelSelect').addEventListener('change', (e) => { try { localStorage.setItem(LS_MODEL, e.target.value); } catch {} });

try { if (window.mermaid) mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'default', flowchart: { htmlLabels: false } }); } catch {}

load();
if (chats.length) currentId = chats[chats.length - 1].id;
renderAll();

// Startup self-check: tells you exactly what is missing
[['puter', 'Puter AI engine'], ['marked', 'Markdown renderer'], ['DOMPurify', 'Sanitizer'], ['hljs', 'Code highlighter'], ['pdfjsLib', 'PDF reader'], ['mammoth', 'DOCX reader'], ['mermaid', 'Diagram renderer']]
  .forEach(([k, label]) => { if (!window[k]) diag(label + ' failed to load (internet/CDN blocked?).'); });
if (location.protocol === 'file:') diag('Opened as a local file. If the AI does not answer, upload this file to a host (Netlify Drop / GitHub Pages) or use the "My Anthropic API key" model option.');
</script>
